<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الذكريات 💖</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1a0a2e 0%, #0d041a 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: white;
        }

        .lock-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            z-index: 10;
            width: 300px;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #ffb3ff;
        }

        p {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 30px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #ff66b3, #ffccff);
            color: #330033;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #error-msg {
            color: #ff4d4d;
            font-size: 12px;
            margin-top: -15px;
            margin-bottom: 15px;
            display: none;
        }

        .heart {
            position: absolute;
            color: rgba(255, 102, 179, 0.3);
            font-size: 20px;
            user-select: none;
            animation: floatHearts 10s linear infinite;
            z-index: 1;
        }

        @keyframes floatHearts {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="hearts-container"></div>

    <div class="lock-container">
        <h2>جاهزة؟ 😉💖</h2>
        <p>كل اللي هنا هيفضل بيني وبينك طول العمر.. اكتبِ الباسورد عشان تفتحي صندوق الذكريات.</p>
        
        <input type="password" id="password-input" placeholder="اكتبِ كلمة السر هنا...">
        <p id="error-msg">اممم، الباسورد غلط.. جربي تاني! 🤔</p>
        
        <button onclick="checkPassword()">يلا بسرعة افتحي! 🥰</button>
    </div>

    <script>
        function createHearts() {
            const container = document.getElementById('hearts-container');
            const heartIcons = ['❤️', '💖', '💗', '💕'];
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDelay = Math.random() * 10 + 's';
                heart.style.fontSize = Math.random() * 20 + 10 + 'px';
                container.appendChild(heart);
            }
        }
        createHearts();

        function checkPassword() {
            const input = document.getElementById('password-input').value;
            const errorMsg = document.getElementById('error-msg');
            
            if (input.toLowerCase() === 'love') {
                window.location.href = 'memories.html';
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('password-input').value = '';
            }
        }
    </script>
</body>
</html>
