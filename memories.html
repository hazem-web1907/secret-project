<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صندوق ذكرياتنا 📸💖</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1a0a2e, #2d124a);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-align: center;
        }

        h1 {
            color: #ffb3ff;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .timeline {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .memory-card {
            background: rgba(255, 255, 255, 0.07);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            transition: transform 0.3s;
        }

        .memory-card:hover {
            transform: scale(1.02);
        }

        .memory-card img {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .memory-card p {
            font-size: 16px;
            line-height: 1.6;
            color: #fce4ec;
            margin: 0;
        }
    </style>
</head>
<body>

    <h1>لحظاتنا الحلوة 🌙✨</h1>
    <p class="subtitle">أجمل حكايات عشناها مع بعض..</p>

    <div class="timeline">
        <!-- الذكرى الأولى -->
        <div class="memory-card">
            <img src="photo1.jpeg" alt="الذكرى الأولى">
            <p>هنا أصل الحكاية وأحلى بداية.. الكلام الجميل والذكريات الحلوة اللي بيننا 🥰.</p>
        </div>

        <!-- الذكرى الثانية -->
        <div class="memory-card">
            <img src="photo2.jpeg" alt="الذكرى الثانية">
            <p>كل لحظة معاكي بتسيب أثر حلو في قلبي وما بتتنساش أبداً 💖.</p>
        </div>

        <!-- الذكرى الثالثة -->
        <div class="memory-card">
            <img src="photo3.jpeg" alt="الذكرى الثالثة">
            <p>وربنا يديم وجودك ويا رب دايماً نفضل سوا ونزود ذكرياتنا الحلوة سوا ✨.</p>
        </div>
    </div>

</body>
</html>
